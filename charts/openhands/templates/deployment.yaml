apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openhands.fullname" . }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "openhands.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "openhands.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openhands.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.openhands.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.openhands.workspace.enabled }}
            - name: WORKSPACE_MOUNT_PATH
              value: {{ .Values.openhands.workspace.mountPath | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.openhands.persistence.enabled }}
            - name: openhands-data
              mountPath: {{ .Values.openhands.env.FILE_STORE_PATH }}
            {{- end }}
            {{- if .Values.openhands.workspace.enabled }}
            - name: openhands-workspace
              mountPath: {{ .Values.openhands.workspace.mountPath }}
            {{- end }}
            {{- if .Values.openhands.dockerSocket.enabled }}
            - name: docker-socket
              mountPath: {{ .Values.openhands.dockerSocket.mountPath }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if .Values.openhands.persistence.enabled }}
        - name: openhands-data
          persistentVolumeClaim:
            claimName: {{ include "openhands.fullname" . }}-data
        {{- end }}
        {{- if .Values.openhands.workspace.enabled }}
        - name: openhands-workspace
          persistentVolumeClaim:
            claimName: {{ include "openhands.fullname" . }}-workspace
        {{- end }}
        {{- if .Values.openhands.dockerSocket.enabled }}
        - name: docker-socket
          hostPath:
            path: {{ .Values.openhands.dockerSocket.hostPath }}
            type: Socket
        {{- end }}