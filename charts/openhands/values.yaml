# Default values for OpenHands Helm chart
replicaCount: 1

image:
  repository: openhands
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# OpenHands specific configuration
openhands:
  # Environment variables for the OpenHands container
  env:
    SANDBOX_RUNTIME_CONTAINER_IMAGE: "docker.all-hands.dev/all-hands-ai/runtime:0.51-nikolaik"
    SANDBOX_USER_ID: "0"
    RUN_AS_OPENHANDS: "true"
    FILE_STORE: "local"
    FILE_STORE_PATH: "/.openhands"
    INIT_GIT_IN_EMPTY_WORKSPACE: "1"
    USE_HOST_NETWORK: "false"
  
  # Persistent volume claims
  persistence:
    enabled: true
    # Storage class for the PVC
    storageClass: ""
    # Size of the PVC
    size: 10Gi
    # Access mode for the PVC
    accessMode: ReadWriteOnce
    # Annotations for the PVC
    annotations: {}
    
  # Docker socket configuration
  dockerSocket:
    # Mount the Docker socket from the host
    enabled: false
    # Path to the Docker socket on the host
    hostPath: /var/run/docker.sock
    # Path to mount the Docker socket in the container
    mountPath: /var/run/docker.sock
    
  # Workspace configuration
  workspace:
    # Mount a persistent volume for the workspace
    enabled: true
    # Path to mount the workspace in the container
    mountPath: /opt/workspace_base
    # Storage class for the workspace PVC
    storageClass: ""
    # Size of the workspace PVC
    size: 20Gi
    # Access mode for the workspace PVC
    accessMode: ReadWriteOnce
    # Annotations for the workspace PVC
    annotations: {}